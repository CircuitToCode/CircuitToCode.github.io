# Render Blueprint: FastAPI API + managed PostgreSQL.
# GitHub Pages remains the public frontend.
services:
  - type: web
    name: nityanand-portfolio-api
    runtime: python
    region: singapore
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    disk:
      name: portfolio-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nityanand-portfolio-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: nityanand
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: CORS_ORIGINS
        value: https://circuittocode.github.io
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: MAX_UPLOAD_MB
        value: 10
      - key: ENVIRONMENT
        value: production

databases:
  - name: nityanand-portfolio-db
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: "17"
    databaseName: nityanand_portfolio
    user: nityanand_admin
